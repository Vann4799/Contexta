services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: contexta-api
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      PORT: 8001
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_REMOTE_URL: http://embeddings:8070
    expose:
      - "8001"
    depends_on:
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy

  # Protocol adapter for MCP clients. It holds no keys and no database access: it
  # forwards the caller's bearer token to the api over this network, so quota, scope and
  # revocation remain decisions the api makes alone.
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: contexta-mcp
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    environment:
      CONTEXTA_API_INTERNAL_URL: http://api:8001
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: contexta-worker
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      QDRANT_URL: http://qdrant:6333
      WORKER_POLL_INTERVAL: 5
      EMBEDDING_REMOTE_URL: http://embeddings:8070
    depends_on:
      qdrant:
        condition: service_started
      embeddings:
        condition: service_healthy

  # One process holds the model; api and worker both call it over the compose
  # network. Loading it twice does not fit in this host's RAM.
  embeddings:
    build:
      context: .
      dockerfile: apps/embeddings/Dockerfile
    container_name: contexta-embeddings
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    expose:
      - "8070"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: contexta-qdrant
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    expose:
      - "6333"
      - "6334"

  caddy:
    image: caddy:2.8-alpine
    container_name: contexta-caddy
    restart: unless-stopped
    env_file:
      - ${CONTEXTA_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  qdrant_storage:
  caddy_data:
  caddy_config:
