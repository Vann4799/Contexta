# Outside-in uptime alarm. It exists because the whole API was unreachable for ~3 minutes
# when Caddy crash-looped on a Caddyfile the stock image could not parse, and nobody noticed:
# `restart: unless-stopped` makes a crash loop read as "alive" to `docker ps`, so only a probe
# from off the box sees that outage. The on-box companion is deploy/vps/caddy-guard.sh.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a test message to Telegram (no fake outage, no paging decision)
        type: boolean
        default: false

permissions:
  actions: read

concurrency:
  group: uptime-probe
  # A running probe must never be cancelled: its conclusion is the history the next run
  # reads to tell a fresh outage from one it has already paged about.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE: https://api.contexta.my.id
      WEB_PROBE: https://contexta.my.id/robots.txt
      ALERT_AFTER_RUNS: 2
      RESULTS: /tmp/contexta-probe-results.txt
    steps:
      - name: Probe endpoints
        id: probe
        shell: bash
        run: |
          set +e
          # The default `bash -e` here would abort the step on the first non-200, so the
          # remaining targets would never be probed and the outage would be reported as
          # one dead endpoint instead of the whole picture.
          : > "$RESULTS"
          failed=0

          # Matching the body, not only the status code, because a 200 from a
          # TLS-terminating middlebox or a stale CDN error page must not read as
          # "the API answered".
          probe() {
            local label="$1" url="$2" needle="$3" body code
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 15 \
              -H 'User-Agent: contexta-uptime-probe' "$url" 2>/dev/null)"
            [ -z "$code" ] && code=000
            if [ "$code" != "200" ]; then
              printf '%s: FAIL (HTTP %s)\n' "$label" "$code" >> "$RESULTS"
              failed=1
            elif [ -n "$needle" ] && ! grep -q -- "$needle" "$body"; then
              printf '%s: FAIL (HTTP 200 but no %s in body)\n' "$label" "$needle" >> "$RESULTS"
              failed=1
            else
              printf '%s: ok (HTTP 200)\n' "$label" >> "$RESULTS"
            fi
            rm -f "$body"
          }

          probe "api /health"        "$API_BASE/health"        '"service":"contexta-api"'
          probe "api /health/vector" "$API_BASE/health/vector" '"status":"ok"'
          probe "web /robots.txt"    "$WEB_PROBE"              ""

          # Deliberately not probed:
          #   /health/indexing  -> behind get_current_user, answers 401 to anonymous
          #                        callers, so paging on it would page on a healthy stack.
          #   /docs /redoc /openapi.json -> 404 in production by design.
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.probe.outputs.failed }}
        run: |
          set +e
          # There is no persistent filesystem between runs, so the consecutive-failure streak is
          # read back from this workflow's own run history instead of a cache entry that can be
          # silently evicted. Only a `failure` conclusion extends the streak; cancelled, skipped and
          # timed-out runs break it, so runner infrastructure never pages anyone. Dispatched runs
          # count as probes too, which is what makes the page path testable by hand.
          #
          # Restricted to the two triggers this workflow has. A commit whose workflow file cannot be
          # parsed still produces a completed `failure` run on `push` with zero jobs, and that run
          # never probed anything: counting it would make the next healthy run declare a recovery
          # from an outage that never happened, and send it to a phone.
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/uptime.yml/runs?per_page=30" \
            --jq '.workflow_runs[] | select(.status=="completed")
                   | select(.event=="schedule" or .event=="workflow_dispatch") | .conclusion' \
            2>/dev/null)"
          if [ -z "$conclusions" ]; then
            echo "::warning::Could not read previous run history, so the streak restarts at 0 and this run cannot page."
          fi

          prev=0
          while read -r c; do
            [ "$c" = "failure" ] || break
            prev=$((prev + 1))
          done <<< "$conclusions"

          if [ "$FAILED" = "0" ]; then
            if [ "$prev" -ge "$ALERT_AFTER_RUNS" ]; then
              event="recover"
            else
              event="ok"
            fi
            streak=0
          else
            streak=$((prev + 1))
            if [ "$streak" -lt "$ALERT_AFTER_RUNS" ]; then
              event="blip"
            elif [ "$streak" -eq "$ALERT_AFTER_RUNS" ]; then
              event="alert"
            else
              event="down"
            fi
          fi

          {
            echo "event=$event"
            echo "streak=$streak"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"
          echo "event=$event streak=$streak prev=$prev"

      - name: Notify
        if: steps.decide.outputs.event != 'ok' || github.event.inputs.send_test == 'true'
        shell: bash
        env:
          EVENT: ${{ steps.decide.outputs.event }}
          STREAK: ${{ steps.decide.outputs.streak }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          # A dispatched test page is the only way to prove these secrets reach the runner
          # without breaking production first. It says what it is, because a message that reads
          # like a recovery when nothing went down teaches nobody to trust the channel.
          if [ "$SEND_TEST" = "true" ]; then
            subject="Contexta monitor TEST"
            message="*$subject*"$'\n'"Sent by hand from Actions to verify the notification path. Not an outage, not a recovery."
          else
            # A blip is one dead run only. The 3-minute incident this exists for survived
            # more than two 5-minute probes, so two consecutive failed runs is the floor;
            # anything less stays an annotation and does not page.
            # An empty EVENT means the Decide step never produced a decision; silence beats
            # inventing one, because "Contexta UP" sent by a broken run is a lie either way.
            case "$EVENT" in
              blip)
                echo "::warning::Probe failed (1 of $ALERT_AFTER_RUNS consecutive runs needed to alert). Not paging yet."
                exit 0
                ;;
              down)
                echo "::error::Still down; already paged when the streak reached the threshold."
                exit 0
                ;;
              alert | recover) ;;
              *) exit 0 ;;
            esac

            if [ "$EVENT" = "alert" ]; then
              subject="Contexta DOWN"
            else
              subject="Contexta RECOVERED"
            fi

            # parse_mode=Markdown only survives because every line below is our own fixed
            # label text; a remote response body dropped in here could contain unbalanced
            # underscores and make Telegram reject the whole message.
            message="*$subject*"$'\n'"$(cat "$RESULTS" 2>/dev/null | sed 's/^/• /')"
            if [ "$EVENT" = "alert" ]; then
              message+=$'\n'"Down across $STREAK consecutive 5-minute probes (~$((STREAK * 5)) min)."
              message+=$'\n'"Both API probes dead points at Caddy: a crash loop still lists the container, with Restarting where Up would be."
            elif [ "$EVENT" = "recover" ]; then
              message+=$'\n'"Recovered after the last failing probe. Confirm the real cause in docker logs contexta-caddy."
            fi
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            # Missing secrets must not hide the outage. Report through the annotation and the
            # summary and stop, rather than failing on an empty URL, because a crashed notifier
            # reads like a monitoring problem instead of a production one.
            echo "::error::Not notified: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be set as repository secrets (Settings -> Secrets and variables -> Actions -> Repository secrets)."
            echo "### $subject (no notification sent)" >> "$GITHUB_STEP_SUMMARY"
            echo 'Notification secrets are absent, so this status only exists in this run.' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # No -v and no echoing the URL: the bot token rides inside it.
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${message}")"
          if [ "$status" != "200" ]; then
            echo "::error::Telegram returned HTTP $status; the bot may be blocked by the chat or the token is wrong."
          fi

      - name: Report
        if: always()
        shell: bash
        env:
          EVENT: ${{ steps.decide.outputs.event }}
          STREAK: ${{ steps.decide.outputs.streak }}
          FAILED: ${{ steps.probe.outputs.failed }}
        run: |
          set +e
          {
            echo "## Uptime probe — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| target | result |"
            echo "| --- | --- |"
            while IFS=: read -r label rest; do
              echo "| $label |$rest |"
            done < "$RESULTS"
            echo ""
            echo "Event: **$EVENT** · consecutive failed probe runs: **$STREAK** · alerts after $ALERT_AFTER_RUNS."
            echo ""
            echo "This is a scheduled job, not a monitor: GitHub may delay or skip runs, and"
            echo "it stops running entirely if the repository goes inactive. See the uptime"
            echo "section in docs/DEPLOYMENT.md."
          } >> "$GITHUB_STEP_SUMMARY"

          # A failing probe must leave the run red even when it does not page, because the
          # next run counts these red runs to decide when an outage is old enough to alert.
          [ "$FAILED" = "1" ] && exit 1
          exit 0
