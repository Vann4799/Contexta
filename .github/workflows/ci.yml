name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/rag
          - apps/api
          - apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.project }}" = "apps/api" ]; then
            python -m pip install -e packages/rag -e apps/api[dev]
          elif [ "${{ matrix.project }}" = "apps/worker" ]; then
            python -m pip install -e packages/rag -e apps/worker pytest
          else
            python -m pip install -e "packages/rag[dev,remote-embeddings]"
          fi
      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Placeholder public config, not the production values. `next build` prerenders every
      # route and reads these while it does; without them the job fails on configuration
      # instead of on the change being gated. Vercel supplies the real ones.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_API_BASE_URL: https://api.placeholder.test
    steps:
      - uses: actions/checkout@v4
      # pnpm, because that is what the lockfile is: the npm cache here pointed at a
      # package-lock.json this repo has never had, which failed the job before lint ran.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
