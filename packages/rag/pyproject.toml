[project]
name = "contexta-rag"
version = "0.1.0"
description = "Shared RAG utilities for Contexta"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers>=3.0.0",
]
remote-embeddings = [
  "httpx>=0.27.0",
]
# Only contexta_rag.extraction needs these, and nothing imports that module through
# the package __init__, so the embeddings sidecar stays free of both readers.
extraction = [
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.0",
]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
